<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudo da página</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <style>
      .bloco {
        height: 100px;
        width: 100px;
        border: 2px solid black;
        margin: 10px;
        border-radius: 50%;
      }

      .bloco1 {
        background-color: #4b164c;
      }

      .bloco2 {
        background-color: #f4d35e;
      }

      .bloco3 {
        background-color: #587b48;
      }

      .bloco4 {
        background-color: #fbfaf5;
      }

      h1,
      h2 {
        font-family: "Playfair Display", serif;
      }

      h3,
      p,
      span {
        font-family: "Inter", sans-serif;
      }

      img {
        width: 96px;
        height: 96px;
      }

      .img-gif {
        width: 200px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="bloco bloco1"></div>
    <div class="bloco bloco2"></div>
    <div class="bloco bloco3"></div>

    <h1>Titulo Principal, teste</h1>

    <img src="./src/media/img/blueberry.png" alt="" />

    <img src="./src/media/img/icons8-folha-96.png" alt="" />
    <img src="./src/media/img/leaf_2607628.png" alt="" />
    <img src="./src/media/img/tigela.png" alt="" />
    <img
      src="./src/media/img/Animation - 1745901726666.gif"
      alt=""

    />

</html>
